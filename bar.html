<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bass &amp; Brew Bar" />
    <meta name="theme-color" content="#0A0B0F" />
    <link rel="manifest" href="./manifest-bar.json" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-bar-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-bar-512.png" />
    <link rel="icon" type="image/png" href="./icons/icon-bar-192.png" />
    <title>Bass &amp; Brew — Pha Chế</title>
    <link rel="stylesheet" href="./portal.css?v=1" />
</head>
<body data-target="/bar">
    <main class="portal-card">
        <img src="./images/logo-full.png" alt="Bass &amp; Brew" class="portal-logo" />
        <div class="neon-line"></div>
        <div class="role-badge role-bar">🔔 QUẦY PHA CHẾ — CỔNG CỐ ĐỊNH</div>
        <div id="portal-spinner" class="spinner"></div>
        <div id="portal-status" class="portal-status loading">🔄 Đang tìm máy chủ Bass &amp; Brew...</div>
        <p id="portal-detail" class="portal-detail">Tự động nối tới đường truyền mới nhất của laptop quầy thu ngân.</p>
        <button id="portal-retry-btn" type="button" class="btn btn-primary">🔄 Thử kết nối lại ngay</button>
        <div class="portal-footer">
            Ghim trang này ra màn hình chính iPhone 1 lần — dùng mãi mãi không đổi link!<br />
            <a id="portal-switch-link" href="./order.html">📱 Chuyển sang màn hình Order</a>
        </div>
    </main>
    <script src="./portal.js?v=1"></script>
</body>
</html>
